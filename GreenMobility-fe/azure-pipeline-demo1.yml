# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
  branches:
    include:
      - release-demo/*

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  displayName: 'Installazione Node.js'
  inputs:
    version: '22.x'

- script: |
    npm install
    npm run build
  displayName: 'npm install and build'
- task: ArchiveFiles@2
  displayName: 'Compressione file compilati in ZIP'
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist/GreenMobility-fe/browser'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
    replaceExistingArchive: true
- task: PublishBuildArtifacts@1
  displayName: 'Archivio artefatti'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
- task: AzureRmWebAppDeployment@5
  displayName: 'Deploy su App Service (Frontend)'
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'Speziale Azure for Students(cf6e1cad-f361-4c3d-b4ee-c98ec2fc8344)'
    appType: 'webAppLinux'
    WebAppName: 'wa-fe-greenmobility-demo'
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
    RuntimeStack: 'NODE|22-lts'
    DeploymentTypeLinux: 'oneDeploy'