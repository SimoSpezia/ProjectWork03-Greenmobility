<app-header></app-header>

<div class="container hubs-page py-4">

  <div class="row g-2 align-items-center mb-4">
    <div class="col">
      <div class="hubs-header">
        <h2 class="hubs-title">
          <i class="bi bi-geo-alt-fill me-2 text-success"></i>Hub disponibili
        </h2>
        <p class="hubs-subtitle text-muted">Seleziona un hub per vedere i veicoli disponibili</p>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4 ms-md-auto">
      <div class="input-group">
        <span class="input-group-text">
          <i class="bi bi-search"></i>
        </span>
        <input type="text" class="form-control" placeholder="Cerca per città o nome" [(ngModel)]="searchTerm">
      </div>
    </div>
  </div>
  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    @for (hub of filteredHubs; track hub.id) {
    <div class="col">
      <div class="hub-card card h-100 border-0 shadow-sm" (click)="navigateToHubVehicles(hub)" role="button">

        <div class="card-body px-3 py-2">
          <div class="d-flex align-items-center mb-1 gap-3">
            <div class="hub-icon-wrap">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <h3 class="hub-name mb-0 flex-grow-1">{{ hub.name }}</h3>
          </div>
          <p class="hub-address text-secondary fs-4 mt-4 mb-0">
            <i class="bi bi-map me-1"></i>{{ hub.address }}<br>{{ hub.city }}
          </p>
        </div>
        <div class="card-footer hub-footer border-0 px-3 pb-2 pt-0 text-end bg-transparent">
          <span class="hub-cta fs-5 text-cta fw-bold">Vedi veicoli <i class="bi bi-arrow-right ms-1"></i></span>
        </div>
      </div>
    </div>
    } @empty {
    @if (isLoading) {
    <div class="col-12 text-center text-muted py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </div>
    } @else {
    <div class="col-12 text-center text-muted py-5">
      <i class="bi bi-inbox fs-1"></i>
      <p class="mt-2">Nessun hub disponibile al momento.</p>
    </div>
    }
    }
  </div>

</div>
